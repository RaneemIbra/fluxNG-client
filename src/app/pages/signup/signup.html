<div class="signup-background">
  <div class="signup-content-container">
    <h1 class="signup-title">Ink Flux</h1>
    <h3 class="signup-subtitle">Where masterpieces find their rhythm</h3>
    <div class="signup-form-container">
      <h2 class="signup-form-title">Create Studio Account</h2>
      <form>
        <flux-input
          formControlName="email"
          inputType="text"
          inputIcon="mail"
          inputPlaceholder="Enter your email address"
          [maxLength]="50"
        >
        </flux-input>
        <flux-input
          formControlName="password"
          inputType="password"
          inputIcon="lock"
          inputPlaceholder="Password"
        ></flux-input>
      </form>
    </div>
  </div>
</div>
